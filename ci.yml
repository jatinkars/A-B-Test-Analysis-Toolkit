name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest tests/test_units.py -q

      # The calibration suite verifies the STATISTICS, not just the code:
      # that the 95% interval really covers the truth 95% of the time, that
      # the A/A false positive rate is ~5%, and that a test designed for 80%
      # power achieves it. A refactor that breaks a standard error fails here.
      - name: Statistical calibration
        run: python -m pytest tests/test_calibration.py -q

      - name: Smoke-test the CLI
        run: python -m abtest --n 8000
